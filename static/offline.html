<!doctype html>
<html lang="he" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>אין חיבור — Grid AAC Clone</title>
		<style>
			:root {
				--bg: #f0f4f8;
				--text: #1a202c;
				--muted: #718096;
				--card: #ffffff;
				--border: #e2e8f0;
				--primary: #1976d2;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #1a202c;
					--text: #f7fafc;
					--muted: #a0aec0;
					--card: #2d3748;
					--border: #4a5568;
					--primary: #63b3ed;
				}
			}
			* { box-sizing: border-box; margin: 0; padding: 0; }
			body {
				font-family: system-ui, sans-serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100dvh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
			}
			.card {
				background: var(--card);
				border: 1px solid var(--border);
				border-radius: 1rem;
				padding: 2.5rem 2rem;
				text-align: center;
				max-width: 24rem;
				width: 100%;
			}
			.icon {
				font-size: 3rem;
				margin-bottom: 1rem;
			}
			h1 {
				font-size: 1.4rem;
				margin-bottom: 0.5rem;
			}
			p {
				color: var(--muted);
				font-size: 0.95rem;
				line-height: 1.6;
				margin-bottom: 1.5rem;
			}
			button {
				background: var(--primary);
				color: #fff;
				border: none;
				border-radius: 0.5rem;
				padding: 0.65rem 1.5rem;
				font-size: 1rem;
				cursor: pointer;
			}
			button:active { opacity: 0.85; }
		</style>
	</head>
	<body>
		<div class="card">
			<div class="icon">📡</div>
			<h1>אין חיבור לאינטרנט</h1>
			<p>לא ניתן לטעון את הדף כרגע.<br />בדוק את החיבור ונסה שוב.</p>
			<button onclick="location.reload()">נסה שוב</button>
		</div>
	</body>
</html>
